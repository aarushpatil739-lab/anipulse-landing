# Railway deployment configuration (TOML mirror of railway.json)
# When both files exist, railway.json takes precedence on the platform.
# This file is kept as documentation / Nixpacks fallback.

[deploy]
startCommand = "python verify_deps.py || true; exec uvicorn server:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1 --log-level info --timeout-keep-alive 65"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
