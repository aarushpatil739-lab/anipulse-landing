# Railway deployment configuration
# NOTE: railway.json takes precedence when both are present.
# This file is kept as documentation / fallback only.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python verify_deps.py || true; exec uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info"
healthcheckPath = "/api/health/ffmpeg"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
